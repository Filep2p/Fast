<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>HyperCrypt | Ultimate Speed P2P File Transfer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0b0e1a, #03050c);
            min-height: 100vh;
            padding: clamp(0.8rem, 4vw, 2rem);
            color: #eef5ff;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            background: linear-gradient(135deg, #c084fc, #60a5fa, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }
        .hero p {
            color: #94a3b8;
            font-size: clamp(0.8rem, 3vw, 1rem);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background: rgba(15, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 1.8rem;
            border: 1px solid rgba(96, 165, 250, 0.25);
            padding: 1.4rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            border-color: #818cf8;
            transform: translateY(-3px);
        }
        .card-title {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .peer-id-box {
            background: #0a0e1c;
            border-radius: 1rem;
            padding: 0.7rem;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #2d3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        button {
            background: linear-gradient(95deg, #2d3a6e, #1e2a4a);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: clamp(0.75rem, 3vw, 0.9rem);
        }
        button.primary {
            background: linear-gradient(95deg, #4f46e5, #7c3aed);
            box-shadow: 0 4px 12px rgba(79,70,229,0.3);
        }
        button.primary:hover {
            transform: scale(0.98);
            box-shadow: 0 6px 16px rgba(79,70,229,0.4);
        }
        input, .file-dropzone {
            background: #0a0e1c;
            border: 1px solid #2d3a5e;
            border-radius: 1.5rem;
            padding: 0.7rem 1rem;
            width: 100%;
            color: white;
            font-family: inherit;
            font-size: clamp(0.8rem, 3vw, 0.9rem);
        }
        .file-dropzone {
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-dropzone.drag-over {
            border-color: #a78bfa;
            background: #1e1f3a;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin: 0.6rem 0;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            transition: width 0.2s;
        }
        .status-badge {
            font-size: 0.7rem;
            background: #0f1422;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .qr-area {
            display: flex;
            justify-content: center;
            margin: 0.8rem 0;
        }
        canvas#qrCanvas {
            background: white;
            padding: 8px;
            border-radius: 20px;
            width: 140px;
            height: 140px;
        }
        .watermark {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.75rem;
            opacity: 0.6;
            font-family: monospace;
            color: #b9c3ff;
        }
        .flex-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            align-items: center;
        }
        @media (max-width: 700px) {
            .flex-row { flex-direction: column; }
            .flex-row button { width: 100%; }
        }
        /* scanner modal responsive */
        #qr-reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>⚡ HyperCrypt</h1>
        <p>Maximum speed • Encrypted P2P • QR connect • No limits</p>
    </div>

    <div class="cards-grid">
        <!-- Identity + QR -->
        <div class="card">
            <div class="card-title">🆔 Your ID & QR</div>
            <div class="peer-id-box">
                <span id="myPeerId">loading...</span>
                <button id="copyIdBtn">📋 Copy</button>
            </div>
            <div class="qr-area" id="qrContainer"></div>
            <button id="newIdBtn" style="width:100%;">🔄 New Identity</button>
            <div class="status-badge" id="connStatus">⚡ Not connected</div>
        </div>

        <!-- Connect: manual + QR scanner -->
        <div class="card">
            <div class="card-title">🔌 Connect to Peer</div>
            <div class="flex-row">
                <input type="text" id="remoteIdInput" placeholder="Paste Peer ID" style="flex:2;">
                <button id="connectBtn" class="primary">Connect</button>
            </div>
            <button id="scanQrBtn" style="width:100%; margin-top:0.8rem;">📷 Scan QR Code</button>
            <div id="connFeedback" class="status-badge"></div>
        </div>

        <!-- Send file panel -->
        <div class="card" id="sendCard" style="display: none;">
            <div class="card-title">📤 Send File</div>
            <div id="dropzone" class="file-dropzone">
                📁 Click or drag file here
                <input type="file" id="fileInput" style="display:none;">
            </div>
            <div id="filePreview" style="font-size:0.75rem; margin:0.5rem 0;"></div>
            <div class="progress-bar"><div class="progress-fill" id="sendProgressFill"></div></div>
            <div id="sendStatus" class="status-badge">No file selected</div>
            <button id="sendBtn" class="primary" style="width:100%; margin-top:0.8rem;" disabled>🚀 Encrypt & Send</button>
        </div>

        <!-- Receive panel -->
        <div class="card" id="receiveCard" style="display: none;">
            <div class="card-title">📥 Incoming Transfer</div>
            <div id="receiveInfo">Waiting for file...</div>
            <div class="progress-bar"><div class="progress-fill" id="receiveProgressFill"></div></div>
            <div id="receiveStatus" class="status-badge">—</div>
            <button id="downloadBtn" style="display:none; width:100%; margin-top:0.8rem;">💾 Decrypt & Save</button>
        </div>
    </div>
    <div class="watermark">✨ সুইট বয় নয়ন ✨ | 1MB chunks • AES‑256‑GCM • Ultra‑fast P2P</div>
</div>

<script>
    // ---------- DOM elements ----------
    const myPeerIdSpan = document.getElementById('myPeerId');
    const copyIdBtn = document.getElementById('copyIdBtn');
    const newIdBtn = document.getElementById('newIdBtn');
    const remoteIdInput = document.getElementById('remoteIdInput');
    const connectBtn = document.getElementById('connectBtn');
    const scanQrBtn = document.getElementById('scanQrBtn');
    const connStatusSpan = document.getElementById('connStatus');
    const connFeedback = document.getElementById('connFeedback');
    const sendCard = document.getElementById('sendCard');
    const receiveCard = document.getElementById('receiveCard');
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const filePreview = document.getElementById('filePreview');
    const sendBtn = document.getElementById('sendBtn');
    const sendProgressFill = document.getElementById('sendProgressFill');
    const sendStatus = document.getElementById('sendStatus');
    const receiveInfo = document.getElementById('receiveInfo');
    const receiveProgressFill = document.getElementById('receiveProgressFill');
    const receiveStatus = document.getElementById('receiveStatus');
    const downloadBtn = document.getElementById('downloadBtn');
    const qrContainer = document.getElementById('qrContainer');

    // ---------- globals ----------
    let peer = null;
    let currentConn = null;
    let myId = null;

    // transfer state
    let incomingMeta = null;
    let incomingChunks = [];
    let incomingChunkCount = 0;
    let activeTransferId = null;

    // CHUNK SIZE: 1MB (1048576 bytes) — maximum safe for WebRTC
    const CHUNK_SIZE = 1024 * 1024;  // 1 MB chunks = ultra speed

    // helper: generate transfer ID
    function genTransferId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }

    // ---------- PeerJS init ----------
    function initPeer(customId = null) {
        if (peer) peer.destroy();
        const id = customId || ('hyper_' + Math.random().toString(36).substring(2, 10));
        peer = new Peer(id, {
            debug: 0,
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', (id) => {
            myId = id;
            myPeerIdSpan.innerText = id;
            connStatusSpan.innerHTML = '✅ Ready';
            generateQR(id);
        });

        peer.on('error', (err) => {
            console.error(err);
            connStatusSpan.innerHTML = '⚠️ Error: ' + err.message;
        });

        peer.on('connection', (conn) => {
            setupConnection(conn);
            connFeedback.innerHTML = '📞 Incoming connection!';
        });
    }

    // generate QR using QRious
    function generateQR(text) {
        qrContainer.innerHTML = '';
        const qr = new QRious({
            element: document.createElement('canvas'),
            value: text,
            size: 140,
            background: 'white',
            foreground: 'black'
        });
        qrContainer.appendChild(qr.canvas);
    }

    // setup data channel (optimized for speed)
    function setupConnection(conn) {
        if (currentConn && currentConn.open) currentConn.close();
        currentConn = conn;
        sendCard.style.display = 'block';
        receiveCard.style.display = 'block';
        resetSendUI();
        resetReceiveUI();

        conn.on('open', () => {
            connStatusSpan.innerHTML = `🔗 Connected to ${conn.peer}`;
            connFeedback.innerHTML = '✅ Connected! Ready to send files.';
            sendBtn.disabled = false;
        });

        conn.on('data', async (data) => {
            await handleIncoming(data);
        });

        conn.on('close', () => {
            connStatusSpan.innerHTML = '⚠️ Connection closed';
            sendCard.style.display = 'none';
            receiveCard.style.display = 'none';
            currentConn = null;
        });
    }

    // handle incoming protocol messages
    async function handleIncoming(msg) {
        if (!msg.type) return;
        switch (msg.type) {
            case 'fileStart':
                resetReceiveUI();
                incomingMeta = {
                    fileName: msg.fileName,
                    fileSize: msg.fileSize,
                    totalChunks: msg.totalChunks,
                    key: new Uint8Array(msg.key),
                    iv: new Uint8Array(msg.iv),
                    transferId: msg.transferId
                };
                activeTransferId = msg.transferId;
                incomingChunks = new Array(msg.totalChunks);
                incomingChunkCount = 0;
                receiveInfo.innerText = `📥 Receiving: ${msg.fileName} (${(msg.fileSize / 1024 / 1024).toFixed(2)} MB)`;
                receiveStatus.innerText = `0 / ${msg.totalChunks} chunks`;
                receiveProgressFill.style.width = '0%';
                break;

            case 'fileChunk':
                if (activeTransferId === msg.transferId && incomingMeta) {
                    incomingChunks[msg.chunkIndex] = new Uint8Array(msg.data);
                    incomingChunkCount++;
                    const percent = (incomingChunkCount / incomingMeta.totalChunks) * 100;
                    receiveProgressFill.style.width = percent + '%';
                    receiveStatus.innerText = `${incomingChunkCount} / ${incomingMeta.totalChunks} chunks`;
                    if (incomingChunkCount === incomingMeta.totalChunks) {
                        await reassembleAndDecrypt();
                    }
                }
                break;
        }
    }

    async function reassembleAndDecrypt() {
        if (!incomingMeta) return;
        receiveStatus.innerText = 'Reassembling & decrypting...';
        // merge chunks
        let totalLen = 0;
        for (let i = 0; i < incomingChunks.length; i++) totalLen += incomingChunks[i].length;
        const encrypted = new Uint8Array(totalLen);
        let offset = 0;
        for (let i = 0; i < incomingChunks.length; i++) {
            encrypted.set(incomingChunks[i], offset);
            offset += incomingChunks[i].length;
        }
        try {
            const cryptoKey = await window.crypto.subtle.importKey(
                'raw', incomingMeta.key, { name: 'AES-GCM' }, false, ['decrypt']
            );
            const decrypted = await window.crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: incomingMeta.iv }, cryptoKey, encrypted
            );
            const blob = new Blob([decrypted], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = incomingMeta.fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                receiveInfo.innerText = `✅ Saved: ${incomingMeta.fileName}`;
                downloadBtn.style.display = 'none';
                resetReceiveUI();
            };
            downloadBtn.style.display = 'block';
            receiveInfo.innerText = `✨ Ready: ${incomingMeta.fileName}`;
            receiveStatus.innerText = 'Decryption complete.';
        } catch (e) {
            console.error(e);
            receiveInfo.innerText = '❌ Decryption failed';
            receiveStatus.innerText = 'Error: ' + e.message;
        }
    }

    // send file with high-speed chunking
    async function encryptAndSendFile(file) {
        if (!currentConn || !currentConn.open) {
            sendStatus.innerText = '❌ Not connected';
            return;
        }
        sendStatus.innerText = 'Reading file...';
        const fileBuffer = await file.arrayBuffer();
        const data = new Uint8Array(fileBuffer);

        const key = await window.crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
        const iv = window.crypto.getRandomValues(new Uint8Array(12));
        sendStatus.innerText = 'Encrypting (AES-256-GCM)...';
        const encrypted = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
        const encryptedData = new Uint8Array(encrypted);
        const rawKey = await window.crypto.subtle.exportKey('raw', key);
        const keyArray = new Uint8Array(rawKey);

        const totalChunks = Math.ceil(encryptedData.length / CHUNK_SIZE);
        const transferId = genTransferId();

        // send metadata
        currentConn.send({
            type: 'fileStart',
            fileName: file.name,
            fileSize: encryptedData.length,
            totalChunks: totalChunks,
            key: Array.from(keyArray),
            iv: Array.from(iv),
            transferId: transferId
        });

        sendStatus.innerText = `Sending ${totalChunks} chunks (1MB each)...`;
        sendProgressFill.style.width = '0%';

        // send chunks without any delay
        for (let i = 0; i < totalChunks; i++) {
            const start = i * CHUNK_SIZE;
            const end = Math.min(start + CHUNK_SIZE, encryptedData.length);
            const chunk = encryptedData.slice(start, end);
            currentConn.send({
                type: 'fileChunk',
                transferId: transferId,
                chunkIndex: i,
                data: Array.from(chunk)
            });
            const percent = ((i + 1) / totalChunks) * 100;
            sendProgressFill.style.width = percent + '%';
            sendStatus.innerText = `Sent ${i+1}/${totalChunks} chunks (${Math.round(percent)}%)`;
        }
        sendStatus.innerText = '✅ Transfer complete!';
        setTimeout(() => sendStatus.innerText = 'Ready', 2000);
    }

    // UI reset
    function resetSendUI() {
        sendProgressFill.style.width = '0%';
        sendStatus.innerText = 'No file selected';
        sendBtn.disabled = true;
        filePreview.innerText = '';
        if (fileInput) fileInput.value = '';
    }
    function resetReceiveUI() {
        receiveInfo.innerText = 'Waiting for file...';
        receiveProgressFill.style.width = '0%';
        receiveStatus.innerText = '—';
        downloadBtn.style.display = 'none';
        incomingChunks = [];
        incomingMeta = null;
        activeTransferId = null;
        incomingChunkCount = 0;
    }

    // Drag & drop + file selection
    function setupDragDrop() {
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) handleFileSelected(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFileSelected(e.target.files[0]);
        });
    }
    function handleFileSelected(file) {
        if (!file) return;
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        filePreview.innerText = `📁 ${file.name} (${sizeMB} MB)`;
        sendBtn.disabled = false;
        window.selectedFile = file;
    }

    // QR scanning with robust error handling
    let html5QrCode = null;
    function startQrScanner() {
        // Create modal overlay
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.backgroundColor = 'rgba(0,0,0,0.9)';
        overlay.style.zIndex = '2000';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '1rem';

        const scannerDiv = document.createElement('div');
        scannerDiv.id = 'qr-reader';
        scannerDiv.style.width = '100%';
        scannerDiv.style.maxWidth = '450px';
        scannerDiv.style.backgroundColor = '#000';
        scannerDiv.style.borderRadius = '24px';
        scannerDiv.style.overflow = 'hidden';
        overlay.appendChild(scannerDiv);

        const closeBtn = document.createElement('button');
        closeBtn.innerText = '✖ Cancel';
        closeBtn.style.marginTop = '1rem';
        closeBtn.style.background = '#ff4d4d';
        closeBtn.style.border = 'none';
        closeBtn.style.padding = '0.6rem 1.2rem';
        closeBtn.style.borderRadius = '2rem';
        closeBtn.style.color = 'white';
        closeBtn.style.fontWeight = 'bold';
        closeBtn.style.cursor = 'pointer';
        closeBtn.addEventListener('click', () => {
            if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(console.warn);
            overlay.remove();
        });
        overlay.appendChild(closeBtn);
        document.body.appendChild(overlay);

        html5QrCode = new Html5Qrcode("qr-reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            // success
            remoteIdInput.value = decodedText;
            html5QrCode.stop().then(() => {
                overlay.remove();
                // auto connect
                connectToPeer(decodedText);
            }).catch(console.warn);
        }, (err) => {
            // scanning error, ignore for now
            console.warn(err);
        }).catch((err) => {
            console.error('Camera start failed', err);
            connFeedback.innerHTML = '❌ Camera access failed. Please allow camera permissions and retry.';
            overlay.remove();
        });
    }

    async function connectToPeer(peerId) {
        if (!peerId) return;
        if (currentConn) currentConn.close();
        const conn = peer.connect(peerId, { reliable: true });
        setupConnection(conn);
        connFeedback.innerHTML = `⏳ Connecting to ${peerId} ...`;
    }

    // event listeners
    copyIdBtn.addEventListener('click', () => {
        if (myId) { navigator.clipboard.writeText(myId); copyIdBtn.innerText = '✓ Copied!'; setTimeout(() => copyIdBtn.innerText = '📋 Copy', 1500); }
    });
    newIdBtn.addEventListener('click', () => { initPeer(); if (currentConn) currentConn.close(); currentConn = null; sendCard.style.display = 'none'; receiveCard.style.display = 'none'; });
    connectBtn.addEventListener('click', () => { const rid = remoteIdInput.value.trim(); if (rid) connectToPeer(rid); else connFeedback.innerHTML = '❌ Enter ID'; });
    scanQrBtn.addEventListener('click', startQrScanner);
    sendBtn.addEventListener('click', async () => {
        if (!window.selectedFile) { sendStatus.innerText = 'Select a file first'; return; }
        if (!currentConn || !currentConn.open) { sendStatus.innerText = 'Not connected'; return; }
        sendBtn.disabled = true;
        await encryptAndSendFile(window.selectedFile);
        sendBtn.disabled = false;
        window.selectedFile = null;
        fileInput.value = '';
        filePreview.innerText = '';
    });

    // start
    initPeer();
    setupDragDrop();
</script>
</body>
</html>
